
services:
  orthanc:
    # issue #50: exact tag AND immutable digest (the multi-arch manifest-list
    # digest -- linux/amd64 + linux/arm64, verified with
    # `docker buildx imagetools inspect orthancteam/orthanc:26.9.1`).
    # orthancteam versions are calendar-style: 26.9.1 bundles Orthanc 1.13.0
    # (verified via `docker run --rm --entrypoint Orthanc
    # orthancteam/orthanc:26.9.1 --version`). :latest must never come back --
    # a silent upstream retag would swap the DICOM server under a graded
    # cohort mid-run. scripts/lint.sh fails if this line and
    # docker-compose.remote-host.yml's orthanc image disagree.
    # BUMP PROCEDURE (deliberately manual): pick the tag, resolve its digest
    # with `docker buildx imagetools inspect --format '{{.Manifest.Digest}}'
    # orthancteam/orthanc:<tag>`, update BOTH compose files to the same
    # tag@digest, then ./scripts/smoke-test.sh (it exercises Orthanc + the
    # DICOMweb/plugins config this app depends on) before merging.
    image: orthancteam/orthanc:26.9.1@sha256:d2705f2c56547e55ce9bc2250fd22d05d326493b3f3d9fa191ecb7db8ca6b5a2
    container_name: ipcmc-orthanc
    restart: unless-stopped
    # issue #69: readiness, not just "the process started". Orthanc answers /system once its
    # database is open. The image has python3 but no curl/wget, so the probe is a Python
    # one-liner; it authenticates with the container's own ORTHANC_PASSWORD (read from the
    # environment, so it never appears on a command line). Generous start_period: the first
    # start on an existing large store can take a while.
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import base64, os, sys, urllib.request
          req = urllib.request.Request("http://127.0.0.1:8042/system")
          req.add_header("Authorization", "Basic " + base64.b64encode(("orthanc:" + os.environ["ORTHANC_PASSWORD"]).encode()).decode())
          sys.exit(0 if urllib.request.urlopen(req, timeout=3).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    environment:
      # Sets the "orthanc" user's password directly (image feature, no
      # RegisteredUsers block needed in orthanc.json). Comes from .env
      # (gitignored) -- see .env.example. No default here on purpose: this
      # is meant to fail loudly if you haven't set one, not silently run
      # with a known placeholder.
      - ORTHANC_PASSWORD=${ORTHANC_PASSWORD:?Set ORTHANC_PASSWORD in .env -- see .env.example}
    volumes:
      - ./docker/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc-storage:/var/lib/orthanc/db
    networks:
      - ipcmc-internal
      - kasm_default_network
    ports:
      # Bound to localhost only: convenience for local testing/debugging so
      # the watermark wrapper's browser (running on this same machine) can
      # iframe Orthanc's own UI directly, avoiding subpath-proxy breakage
      # (Orthanc's Explorer2/Stone-Viewer assets assume they're served from
      # the root of their own origin). Reachability for Kasm's own session
      # containers comes from the kasm_default_network attachment above
      # instead (by container name, e.g. http://ipcmc-orthanc:8042/) - not
      # from this published port, which stays loopback-only.
      - "127.0.0.1:8042:8042"

  grading-api:
    build: ./docker/grading-api
    container_name: ipcmc-grading-api
    restart: unless-stopped
    # issue #69: readiness probe = grading-api's own GET /healthz (checks the database
    # connection). python:3.12-slim has no curl, so urllib; any non-2xx or connection error
    # raises and the probe fails.
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    environment:
      # Shared secret with scripts/create-session.py -- the only client
      # allowed to mint a session token (POST /session). No default here
      # on purpose, same reasoning as ORTHANC_PASSWORD above: fail loudly
      # if it isn't set, not silently run with no secret configured.
      - GRADING_COORDINATOR_KEY=${GRADING_COORDINATOR_KEY:?Set GRADING_COORDINATOR_KEY in .env -- see .env.example}
      # Optional (issue #87): real cases from a local, git-ignored file instead of the
      # placeholder seed -- see README 'Real study data (local only)'. Empty = placeholders.
      - GRADING_CASES_FILE=${GRADING_CASES_FILE:-}
    volumes:
      - grading-db:/data
      # ./local holds cases.json (answer key + reports + study UIDs): git-ignored, read-only here.
      - ./local:/local:ro
    networks:
      # Internal only -- no host port, no kasm_default_network. Nothing
      # outside viewer's nginx (which proxies /api/ to this) needs to reach
      # it directly, same least-exposure pattern as orthanc.
      - ipcmc-internal

  viewer:
    build: ./docker/viewer
    container_name: ipcmc-viewer
    restart: unless-stopped
    # issue #69: start only once both backends answer their health probes, not as soon as
    # their processes exist (the race scripts/smoke-test.sh works around with retry loops;
    # those stay as defence in depth).
    depends_on:
      orthanc:
        condition: service_healthy
      grading-api:
        condition: service_healthy
    # issue #69: the viewer is healthy when nginx serves AND can reach grading-api through
    # its own /api/ proxy (busybox wget exists in the image; no extra package needed).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    environment:
      # Same password as the orthanc service above -- used to compute the
      # auth-injecting proxy's Basic-Auth header at container start (see
      # docker/viewer/15-compute-orthanc-auth.envsh), never hardcoded.
      - ORTHANC_PASSWORD=${ORTHANC_PASSWORD:?Set ORTHANC_PASSWORD in .env -- see .env.example}
    ports:
      - "8080:8080"   # This is the only thing that should ever be reachable directly for this MVP,
                       # and in the real deployment even this gets replaced by Kasm's own gateway -
                       # see README.md "From MVP to the real thing".
      - "127.0.0.1:8043:8043"   # Auth-injecting Orthanc proxy - loopback only. Publishing
                                 # this beyond localhost would hand out unauthenticated Orthanc
                                 # access to anyone who can reach it (see nginx.conf comment).
    networks:
      - ipcmc-internal
      - kasm_default_network

networks:
  ipcmc-internal:
    driver: bridge
  kasm_default_network:
    # Created by the Kasm Workspaces installer, not by this compose file -
    # attaching here is what lets Kasm's session containers reach `orthanc`
    # and `viewer` by container name (see comments above). If Kasm isn't
    # installed yet, comment this network out of both services above and
    # this block, and use `docker compose up` for local-only testing.
    external: true

volumes:
  orthanc-storage:
  grading-db:
