# Standalone compose file for running Orthanc + viewer on their own
# Proxmox-hosted VM/LXC, separate from wherever Kasm Workspaces runs --
# instead of the same-Docker-host setup in docker-compose.yml (which relies
# on attaching to Kasm's own `kasm_default_network` for container-name
# reachability, only possible when both are on the same Docker daemon).
#
# This is a full standalone file, not an override layered on top of
# docker-compose.yml (docker compose's array-merge semantics for `ports`/
# `networks` turned out to append rather than replace when this was tried as
# an override -- see git history. A second complete file is more duplication
# but avoids that entirely).
#
# Usage (on the Proxmox VM/LXC, not your Kasm host):
#   docker compose -f docker-compose.remote-host.yml up -d --build
#
# See docs/PROXMOX_DEPLOYMENT.md for the full picture: provisioning the
# VM/LXC, the firewall rule this REQUIRES (see warning below), and pointing
# the Kasm workspace's Docker Run Config Override at this host's address.
#
# ============================================================================
# REQUIRED: firewall this host's 8042 and 8043 to ONLY your Kasm host's IP.
# ============================================================================
# The same-host setup (docker-compose.yml) gets this isolation for free --
# kasm_default_network is a Docker-internal bridge nothing outside the host
# can reach. This file has no equivalent: BIND_ADDR defaults to 0.0.0.0,
# meaning without a firewall rule, 8042 (Orthanc's Basic-Auth-protected UI)
# and especially 8043 (the auth-injecting proxy -- valid Orthanc access with
# NO auth of its own, see docker/viewer/default.conf.template) are reachable
# by anyone who can reach this host's network at all. This is not optional
# hardening, it's the thing that makes this setup equivalent to the
# same-host one at all.

services:
  orthanc:
    # issue #50: must equal docker-compose.yml's pinned orthanc exactly
    # (tag + digest) -- the lint stage diffs the two. Full rationale and
    # the manual bump procedure live in the comment at docker-compose.yml
    # (orthancteam calendar tag 26.9.1 == Orthanc 1.13.0; the digest is the
    # multi-arch manifest-list, linux/amd64 + linux/arm64).
    image: orthancteam/orthanc:26.9.1@sha256:d2705f2c56547e55ce9bc2250fd22d05d326493b3f3d9fa191ecb7db8ca6b5a2
    container_name: ipcmc-orthanc
    restart: unless-stopped
    # issue #69: readiness, not just "the process started". Orthanc answers /system once its
    # database is open. The image has python3 but no curl/wget, so the probe is a Python
    # one-liner; it authenticates with the container's own ORTHANC_PASSWORD (read from the
    # environment, so it never appears on a command line). Generous start_period: the first
    # start on an existing large store can take a while.
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import base64, os, sys, urllib.request
          req = urllib.request.Request("http://127.0.0.1:8042/system")
          req.add_header("Authorization", "Basic " + base64.b64encode(("orthanc:" + os.environ["ORTHANC_PASSWORD"]).encode()).decode())
          sys.exit(0 if urllib.request.urlopen(req, timeout=3).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    environment:
      - ORTHANC_PASSWORD=${ORTHANC_PASSWORD:?Set ORTHANC_PASSWORD in .env -- see .env.example}
    volumes:
      - ./docker/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc-storage:/var/lib/orthanc/db
    networks:
      - ipcmc-internal
    ports:
      - "${BIND_ADDR:-0.0.0.0}:8042:8042"

  # One-shot, runs before grading-api on every `docker compose up` (follow-up to issue #51).
  # grading-api runs as uid 10001; a `grading-db` volume created by an older (root) image is
  # root-owned and SQLite then fails on the first WRITE with "attempt to write a readonly
  # database" while /healthz (a read) stays green. This service makes the volume owned by 10001
  # once and is idempotent (a no-op on a volume that is already right). It is root, but only
  # for a second, and as small as it can be: no network, read-only root filesystem, every
  # capability dropped except CHOWN. grading-api itself ALSO refuses to start when its data
  # volume is not writable (db._check_data_writable), which covers running the image without
  # this Compose file.
  grading-db-init:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    container_name: ipcmc-grading-db-init
    user: "0:0"
    command: ["chown", "-R", "10001:10001", "/data"]
    volumes:
      - grading-db:/data
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    restart: "no"

  grading-api:
    build: ./docker/grading-api
    container_name: ipcmc-grading-api
    restart: unless-stopped
    # follow-up to #51: wait for the one-shot ownership fix of the data volume.
    depends_on:
      grading-db-init:
        condition: service_completed_successfully
    # issue #69: readiness probe = grading-api's own GET /healthz (checks the database
    # connection). python:3.12-slim has no curl, so urllib; any non-2xx or connection error
    # raises and the probe fails.
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    environment:
      # Shared secret with scripts/create-session.py -- the only client
      # allowed to mint a session token (POST /session). No default here
      # on purpose, same reasoning as ORTHANC_PASSWORD above: fail loudly
      # if it isn't set, not silently run with no secret configured.
      - GRADING_COORDINATOR_KEY=${GRADING_COORDINATOR_KEY:?Set GRADING_COORDINATOR_KEY in .env -- see .env.example}
      # Optional (issue #87): real cases from a local, git-ignored file instead of the
      # placeholder seed -- see README 'Real study data (local only)'. Empty = placeholders.
      - GRADING_CASES_FILE=${GRADING_CASES_FILE:-}
      # issue #98: "start over" deletes the doctor's recorded answers; off unless set to 1 (local testing only).
      - GRADING_RESET_ENABLED=${GRADING_RESET_ENABLED:-0}
    volumes:
      - grading-db:/data
      # ./local holds cases.json (answer key + reports + study UIDs): git-ignored, read-only here.
      - ./local:/local:ro
    networks:
      - ipcmc-internal
    # issue #51 hardening -- identical rationale to the same block in
    # docker-compose.yml (non-root images, comments there explain each
    # line); kept explicit here because this file is deliberately a full
    # standalone, not an override.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777

  viewer:
    build: ./docker/viewer
    container_name: ipcmc-viewer
    restart: unless-stopped
    # issue #69: start only once both backends answer their health probes, not as soon as
    # their processes exist (the race scripts/smoke-test.sh works around with retry loops;
    # those stay as defence in depth).
    depends_on:
      orthanc:
        condition: service_healthy
      grading-api:
        condition: service_healthy
    # issue #69: the viewer is healthy when nginx serves AND can reach grading-api through
    # its own /api/ proxy (busybox wget exists in the image; no extra package needed).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    environment:
      - ORTHANC_PASSWORD=${ORTHANC_PASSWORD:?Set ORTHANC_PASSWORD in .env -- see .env.example}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:8080:8080"
      - "${BIND_ADDR:-0.0.0.0}:8043:8043"
    networks:
      - ipcmc-internal
    # issue #51 hardening -- see docker-compose.yml's viewer block for the
    # full rationale (uid-101 nginx, >1024 ports, conf.d/cache/tmp as the
    # only writable paths, logs via /dev/stderr+/dev/stdout).
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /etc/nginx/conf.d:size=4m,uid=101,gid=101,mode=0755
      - /var/cache/nginx:size=32m,uid=101,gid=101,mode=0755

networks:
  ipcmc-internal:
    driver: bridge

volumes:
  orthanc-storage:
  grading-db:
