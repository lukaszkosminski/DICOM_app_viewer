# Guacamole-based alternative delivery mechanism -- a PoC evaluated
# alongside the Kasm flow specifically because Kasm Workspaces Community
# Edition is capped at 5 concurrent sessions and restricted to non-
# commercial/non-profit/personal use (EULA §2.2, see CLAUDE.md), which
# blocks any real multi-VM cohort deployment without a paid tier + legal/
# procurement review. Apache Guacamole is Apache-licensed with no such cap.
#
# This is an OVERLAY file, not a standalone stack -- run it combined with
# the base compose file so the new services can reach the existing
# viewer/grading-api/orthanc backend by container name over the same
# ipcmc-internal network (already defined there, not redeclared here):
#   docker compose -f docker-compose.yml -f docker-compose.guacamole.yml up -d --build
# See scripts/guacamole-iac.sh, which wraps exactly this.
#
# Deliberately does NOT attach to kasm_default_network -- the whole point
# is a delivery mechanism that doesn't depend on Kasm being installed at
# all. The Weasis+VNC session container (docker/guacamole-weasis/) only
# ever needs to reach `viewer` (VIEWER_URL, and ORTHANC_URL -- both served
# by viewer's own nginx, see docker/viewer/default.conf.template), which
# is already on ipcmc-internal in the base file.
#
# Scope note (explicit, not an oversight): this is a BASIC functionality
# PoC only -- no watermark overlay, no Weasis export/import lockdown, no
# DLP. docker/guacamole-weasis/ is not a security-hardened image the way
# docker/kasm-workspace-weasis/ is; don't point it at real patient data.
#
# Why a whole extra Postgres DB, on top of grading-api's own SQLite: this
# is Guacamole's OWN required auth backend (guacamole-auth-jdbc), storing
# Guacamole users/connections -- something separate from the Lung-RADS
# grading data, not a redundant duplicate of grading-api's own database.
# FOSS Guacamole has no supported anonymous-quick-link mechanism (checked
# before choosing this -- see scripts/provision-guacamole-session.py's own
# comment); a real JDBC-backed user is the officially-supported way to get
# a single clickable, no-further-login-prompt link per student, via the
# documented username/password URL-parameter auto-login.

services:
  guacamole-db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: ipcmc-guacamole-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=guacamole_db
      - POSTGRES_USER=guacamole
      - POSTGRES_PASSWORD=${GUACAMOLE_DB_PASSWORD:?Set GUACAMOLE_DB_PASSWORD in .env -- see .env.example}
    # issue #69: ready when Postgres accepts connections for this database and user.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guacamole -d guacamole_db"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    volumes:
      - guacamole-db-data:/var/lib/postgresql/data
      # Official Apache-licensed schema, regenerate with:
      # docker run --rm guacamole/guacamole:1.6.0 /opt/guacamole/bin/initdb.sh --postgresql
      - ./docker/guacamole/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - ipcmc-internal

  guacd:
    image: guacamole/guacd:1.6.0@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f
    container_name: ipcmc-guacd
    restart: unless-stopped
    # issue #69: guacd is ready when it accepts a TCP connection on its port 4822 (busybox nc).
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4822"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - ipcmc-internal

  guacamole:
    image: guacamole/guacamole:1.6.0@sha256:f344085e618bb05e22b964b0208dbd06d3468275bac70206f93805245e067b40
    container_name: ipcmc-guacamole
    restart: unless-stopped
    # issue #69: do not start the web app before its database and guacd are ready.
    depends_on:
      guacd:
        condition: service_healthy
      guacamole-db:
        condition: service_healthy
    environment:
      - GUACD_HOSTNAME=ipcmc-guacd
      - POSTGRESQL_HOSTNAME=ipcmc-guacamole-db
      - POSTGRESQL_DATABASE=guacamole_db
      - POSTGRESQL_USER=guacamole
      - POSTGRESQL_PASSWORD=${GUACAMOLE_DB_PASSWORD:?Set GUACAMOLE_DB_PASSWORD in .env -- see .env.example}
    # issue #69: the web app is ready when Tomcat serves the login page (curl is in the image).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/guacamole/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    ports:
      # Bound to localhost only, same reasoning as viewer's own :8043 in
      # the base file -- this is an admin/coordinator-facing surface
      # (login page, connection management), not the student-facing one.
      - "127.0.0.1:8090:8080"
    networks:
      - ipcmc-internal

volumes:
  guacamole-db-data:
