<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>IP_CMC Panel oceny</title>
<style>
  /* Issue #5 (Grading Panel): trimmed down from watermark.html -- this is
     the DICOM iframe removed, everything else about the grading panel kept
     as-is. Images now come from Weasis itself (a separate native window,
     launched by custom_startup.sh -- issue #4), not an iframe in this page.
     This page is meant to run as its own small browser window positioned
     beside Weasis, not full-screen kiosk.

     Deterrence, not prevention: see CLAUDE.md for why the
     watermark below is attribution-layer only. */
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#181818; }

  #grading-panel {
    position:absolute; inset:0;
    background:#181818; color:#eee;
    overflow-y:auto; box-sizing:border-box; padding:16px;
    font:14px/1.4 system-ui, sans-serif;
  }
  #grading-panel h2 { margin:0 0 4px; font-size:16px; }
  #grading-panel h3 { margin:12px 0 4px; font-size:14px; }
  #grading-panel h4 { margin:8px 0 2px; font-size:13px; }
  #grading-panel details summary { cursor:pointer; color:#ccc; }
  #grading-panel p { margin:4px 0; color:#ccc; }
  #grading-panel textarea, #grading-panel select {
    width:100%; box-sizing:border-box; margin:8px 0;
    background:#222; color:#eee; border:1px solid #444; border-radius:4px; padding:6px;
  }
  #grading-panel fieldset { border:1px solid #444; border-radius:4px; margin:8px 0; }
  #grading-panel button {
    width:100%; padding:8px; margin-top:8px;
    background:#2d6cdf; color:#fff; border:0; border-radius:4px; cursor:pointer; font-size:14px;
  }
  #grading-panel button:hover { background:#3a7bee; }
  .feedback-correct { color:#4caf50; }
  .feedback-incorrect { color:#e05252; }
  .error { color:#e05252; font-weight:bold; }

  /* Visually separate boxes for "your answer" vs "real diagnosis" -- the
     point of the learning stage is comparing the two, so they need to read
     as distinct blocks, not just stacked paragraphs. */
  .answer-box {
    border:1px solid #444; border-radius:4px; padding:8px 10px; margin:6px 0 14px;
    background:#20202a;
  }
  .answer-box.reference { background:#1a2a1f; border-color:#3a5a40; }
  .answer-box p { margin:0; white-space:pre-wrap; }
  /* issue #201 (radiologist's request): the Lung-RADS scale is shown in bold -- the category
     choices, the reference category, and category mentions inside the reference report. */
  #grading-panel select, #grading-panel select option, #grading-panel strong.lr { font-weight:700; }

  /* Same DOM-text (not canvas) watermark as watermark.html, unchanged --
     see that file's comment for why: mix-blend-mode:difference for
     guaranteed contrast, plain rotated DOM text because a rotated canvas
     render degrades once streamed through Kasm's video codec.

     IMPORTANT -- known interim gap, not silently accepted: this only
     covers THIS window. It does not, and cannot, cover Weasis's separate
     native window. Issue #6 ("Watermark Overlay") replaces this with a
     single always-on-top overlay spanning the whole desktop; until that
     ships, a Weasis session isn't fully watermarked end-to-end even though
     this panel is. Kept here in the meantime (rather than dropped) because
     partial coverage beats none, and CLAUDE.md's hard rule is "mandatory
     for every streamed session" -- removing it here with nothing yet in
     its place would be a straightforward violation of that rule. */
  #watermark-rotator {
    position:absolute; top:-50%; left:-50%; width:200%; height:200%;
    transform: rotate(-15deg);
    pointer-events:none; z-index:10; mix-blend-mode:difference;
    overflow:hidden;
  }
  #watermark-grid {
    display:flex; flex-wrap:wrap; align-content:flex-start;
    width:100%; height:100%;
  }
  .wm-cell {
    color:#fff;
    font: bold 13px monospace;
    white-space:nowrap;
    flex: 0 0 auto;
    padding: 70px 60px; /* denser than watermark.html's 160px/220px -- this
                           window is much smaller (a sidebar, not a full
                           viewport), so the same tile size would leave most
                           of it with zero coverage */
    opacity: 0.3;
  }

  /* Reduce (not eliminate) casual copy/print attempts inside this window */
  * { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #grading-panel, #grading-panel * { user-select:text; } /* students still need to type/select answers */
  @media print { body::before { content:"Printing disabled for this session."; } #grading-panel,#watermark-rotator{display:none;} }
</style>
</head>
<body>
  <div id="grading-panel"><p>Ładowanie danych...</p></div>
  <div id="watermark-rotator"><div id="watermark-grid"></div></div>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const studentId = params.get("student_id") || "UNKNOWN_STUDENT";
  const sessionId = params.get("session_id") || "UNKNOWN_SESSION";
  // studentId/sessionId above are display-only (the watermark text) --
  // grading-api no longer trusts a bare student_id as a credential (a real
  // gap README.md flagged: nothing checked it belonged to the caller, so
  // any request could act as any student). `token` is what every /api/
  // call below actually authenticates with; custom_startup.sh bakes it in
  // the same way, from the value grading-api's own POST /session minted
  // for this specific session.
  // issue #94: token arrives via the URL fragment (#token=...), never a
  // query string -- the browser never sends fragments to the server, so
  // it cannot appear in nginx access/error logs (see watermark.html).
  const hashParams = new URLSearchParams(location.hash.replace(/^#/, ""));
  // issue #145: the token survives a reload (F5, Ctrl+R, a discarded tab) via
  // sessionStorage -- scoped to this one tab/window, cleared when it closes,
  // never sent to any server and never persisted like localStorage would be.
  // Order: URL fragment (a fresh link always wins) -> sessionStorage -> none.
  // The shape check rejects anything that is not a token_urlsafe value, so
  // a mangled fragment can never be stored or sent as a header.
  const TOKEN_KEY = "grading_token";
  const TOKEN_RE = /^[A-Za-z0-9_-]{16,128}$/;
  function readToken() {
    const frag = hashParams.get("token");
    if (frag && TOKEN_RE.test(frag)) {
      try { sessionStorage.setItem(TOKEN_KEY, frag); } catch (_storageBlocked) { /* memory only */ }
      return frag;
    }
    try {
      const stored = sessionStorage.getItem(TOKEN_KEY);
      return TOKEN_RE.test(stored || "") ? stored : "";
    } catch (_storageBlocked) {
      return "";
    }
  }
  let token = readToken();
  // CR #121: erase the fragment from the address bar once read -- the token
  // would otherwise stay visible in the page URL, the window/tab title
  // (both captured in screenshots), and session history. replaceState edits
  // the current entry in place: no reload, no new history step.
  if (location.hash) {
    history.replaceState(null, "", location.pathname + location.search);
  }

  // issue #145 (owner-approved wording): no token, or a 401 from grading-api
  // (unknown OR expired -- the API answers AUTH_INVALID_TOKEN for both), is NOT a
  // transient error: retrying cannot help, so there is no retry button, and nothing
  // is refreshed automatically -- the page waits for a new link.
  const SESSION_EXPIRED_TEXT = "Sesja wygasła lub link jest nieprawidłowy. Zamknij okno i otwórz ponownie link otrzymany od koordynatora.";
  class SessionExpiredError extends Error {}

  const rotator = document.getElementById("watermark-rotator");
  const grid = document.getElementById("watermark-grid");
  const CELL_W = 340, CELL_H = 210; // tuned for a small sidebar window, see CSS comment above

  function rebuildGrid() {
    const cols = Math.ceil(rotator.clientWidth / CELL_W) + 1;
    const rows = Math.ceil(rotator.clientHeight / CELL_H) + 1;
    const needed = cols * rows;
    while (grid.children.length < needed) {
      const span = document.createElement("span");
      span.className = "wm-cell";
      grid.appendChild(span);
    }
    while (grid.children.length > needed) {
      grid.removeChild(grid.lastChild);
    }
  }
  window.addEventListener("resize", rebuildGrid);
  rebuildGrid();

  function updateWatermarkText() {
    const text = `${studentId} | ${sessionId} | ${new Date().toISOString()}`;
    for (const cell of grid.children) cell.textContent = text;
  }

  updateWatermarkText();
  setInterval(updateWatermarkText, 1000);

  // Anti-tamper: reload if the watermark is hidden or removed from the DOM.
  const observer = new MutationObserver(() => {
    if (!document.body.contains(rotator) ||
        rotator.style.display === "none" ||
        rotator.style.visibility === "hidden") {
      window.location.reload();
    }
  });
  observer.observe(document.body, { childList: true, attributes: true, subtree: true });

  // Best-effort deterrents (all bypassable locally, kept for friction + audit signal)
  document.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (e.key === "PrintScreen" || (e.ctrlKey && ["p","s","c"].includes(k))) {
      e.preventDefault();
    }
  });

  // ---- Lung-RADS grading panel ----
  // Unchanged from watermark.html except: no `frame` element to point at a
  // study -- Weasis (a separate native window) shows the images now, this
  // panel only ever renders the form. Talks to grading-api via the
  // same-origin /api/ proxy (see default.conf.template) -- no CORS needed.
  const panel = document.getElementById("grading-panel");
  const STAGE_LABELS = { learning: "Nauka", assessment: "Ocena", test: "Test" };

  let currentCase = null;
  // issue #99: client-side time_spent_seconds removed (never used -- #29
  // computes time-on-task server-side because Date.now() is editable and
  // this data feeds a publication).

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  // issue #201: bold the Lung-RADS category mentions in a piece of text.
  // INPUT MUST ALREADY BE escapeHtml()-ed: the only markup this adds is
  // <strong class="lr">, so nothing in a report (or any data) can inject HTML.
  // Matches "Lung-RADS 4A", "Lung-RADS kategoria 3", "LR-4B", "LR 2S" and the
  // Polish "kategoria/kategorii/kategorie/kategorię 4A" (category 0-3, 4A, 4B, 4X, optional S).
  // The real reports' exact wording is not known to the developers (they are never
  // opened), so the pattern is deliberately one constant: extend it from the
  // owner's feedback, do not scatter variants.
  const LUNG_RADS_MENTION = /\b((?:Lung-?RADS|Lung-?Rads|LR)[\s-]*(?:[Kk]ategori[aięy]\s*)?(?:[0-3]|4[ABX])(?:\s?S)?|[Kk]ategori[aięy]\s+(?:[0-3]|4[ABX])(?:\s?S)?)(?![0-9A-Za-z])/g;
  function boldLungRads(escaped) {
    return escaped.replace(LUNG_RADS_MENTION, '<strong class="lr">$1</strong>');
  }

  // issue #99: exception-/server-derived strings are never interpolated
  // into an innerHTML template again -- showError builds the node through
  // the DOM API and writes the message via textContent, so even a value
  // hijacked by a compromised upstream cannot become markup. Static
  // templates (no dynamic input) may still use innerHTML.
  function showError(prefix, err, buttonId, buttonLabel) {
    panel.replaceChildren();
    const msg = document.createElement("p");
    msg.className = "error";
    msg.textContent = `${prefix}: ${err.message}`;
    panel.append(msg);
    if (buttonId) {
      const b = document.createElement("button");
      b.id = buttonId;
      b.textContent = buttonLabel;
      panel.append(b);
    }
  }

  function showSessionExpired() {
    try { sessionStorage.removeItem(TOKEN_KEY); } catch (_storageBlocked) { /* nothing stored */ }
    token = "";
    panel.replaceChildren();
    const p = document.createElement("p");
    p.id = "session-expired";
    p.className = "error";
    p.textContent = SESSION_EXPIRED_TEXT;
    panel.append(p);
  }

  async function loadCase() {
    if (!token) {
      showSessionExpired();
      return;
    }
    panel.innerHTML = "<p>Ładowanie danych...</p>";
    try {
      const res = await fetch("/api/case", { headers: { "X-Grading-Token": token } });
      if (res.status === 401) {
        throw new SessionExpiredError();
      }
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}: ${res.statusText}`);
      }
      const data = await res.json();
      if (data.complete) {
        await showReview();
        return;
      }
      currentCase = data;
      renderForm(data);
    } catch (err) {
      if (err instanceof SessionExpiredError) {
        showSessionExpired();
        return;
      }
      showError("Błąd ładowania", err, "retry-btn", "Spróbuj ponownie");
      document.getElementById("retry-btn").addEventListener("click", loadCase);
    }
  }

  function renderForm(data) {
    let html = `<h2>${escapeHtml(STAGE_LABELS[data.stage] || data.stage)}</h2>`;
    html += `<p>${escapeHtml(data.title)} (${data.position} / ${data.total_in_stage})</p>`;

    if (data.stage === "learning") {
      html += `
        <label>Twoja ocena (tekst):</label>
        <textarea id="text-input" rows="8" placeholder="Wpisz swoją ocenę badania..."></textarea>
        <button id="submit-btn">Wyślij ocenę</button>`;
    } else {
      const options = data.category_options
        .map(([value, label]) => `<option value="${escapeHtml(value)}">${escapeHtml(label)}</option>`)
        .join("");
      html += `
        <label>Kategoria Lung-RADS:</label>
        <select id="category-input">${options}</select>
        <fieldset>
          <legend>Zmiana istotna klinicznie spoza płuc (modyfikator S)</legend>
          <label><input type="radio" name="modifier-s" value="yes"> Tak</label><br>
          <label><input type="radio" name="modifier-s" value="no" checked> Nie</label>
        </fieldset>
        <button id="submit-btn">Wyślij ocenę</button>`;
    }
    panel.innerHTML = html;
    document.getElementById("submit-btn").addEventListener("click", onSubmit);
  }

  async function onSubmit() {
    const body = {
      token,
      case_id: currentCase.case_id,
      stage: currentCase.stage,
    };
    if (currentCase.stage === "learning") {
      body.text = document.getElementById("text-input").value;
    } else {
      body.category = document.getElementById("category-input").value;
      body.modifier_s = document.querySelector('input[name="modifier-s"]:checked').value === "yes";
    }

    try {
      const res = await fetch("/api/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (res.status === 401) {
        throw new SessionExpiredError();
      }
      if (!res.ok) {
        // issue #61: a 409 here (VALIDATION_CASE_MISMATCH or
        // DUPLICATE_SUBMISSION) means the server's own progress has moved
        // on, or this case was already answered, since this page last
        // loaded it -- never something the student did knowingly (this
        // page only ever submits currentCase.case_id, whatever /api/case
        // last handed it), so resync automatically instead of showing a
        // raw HTTP error and waiting for a manual click.
        let errorCode = null;
        try {
          errorCode = (await res.json()).error_code;
        } catch (_parseErr) {
          // Non-JSON error body (e.g. a raw network/proxy failure) --
          // fall through to the generic handler below.
        }
        if (res.status === 409 && (errorCode === "VALIDATION_CASE_MISMATCH" || errorCode === "DUPLICATE_SUBMISSION")) {
          panel.innerHTML = `<p>Twój postęp się zmienił — pobieramy aktualny przypadek...</p>`;
          await loadCase();
          return;
        }
        throw new Error(`HTTP ${res.status}: ${res.statusText}`);
      }
      const result = await res.json();
      renderFeedback(currentCase.stage, result, body);
    } catch (err) {
      if (err instanceof SessionExpiredError) {
        showSessionExpired();
        return;
      }
      showError("Błąd zapisu", err, "back-btn", "Wróć");
      document.getElementById("back-btn").addEventListener("click", loadCase);
    }
  }

  function renderFeedback(stage, result, submitted) {
    let html = "";
    if (stage === "learning") {
      html = `<h3>Twoja ocena</h3>
        <div class="answer-box"><p>${escapeHtml(submitted.text)}</p></div>
        <h3>Opis referencyjny (prawdziwa diagnoza)</h3>
        <div class="answer-box reference"><p>${boldLungRads(escapeHtml(result.reference_report))}</p></div>`;
    } else if (stage === "assessment") {
      const cls = result.correct ? "feedback-correct" : "feedback-incorrect";
      const label = result.correct ? "Poprawnie" : "Niepoprawnie";
      html = `<h3 class="${cls}">${label}</h3>
        <p>Kategoria referencyjna: <strong class="lr">${escapeHtml(result.ground_truth_category)}${result.ground_truth_modifier_s ? " (S)" : ""}</strong></p>`;
    } else {
      html = `<h3>Odpowiedź zapisana.</h3><p>Brak informacji zwrotnej w module testowym.</p>`;
    }
    html += `<button id="next-btn">Następny przypadek</button>`;
    panel.innerHTML = html;
    document.getElementById("next-btn").addEventListener("click", loadCase);
  }

  // ---- issue #202: end-of-exam review -> approval -> reveal --------------------------------
  // After the last case the doctor sees a read-only summary of their OWN answers (all three
  // stages). Only after "Zatwierdź i zakończ" (POST /api/finalize) does the server release the
  // correct answers (GET /api/results); the panel never decides this, the server enforces it.
  // Everything that comes from the API is escaped before it is put into innerHTML.
  const REVIEW_EXCERPT = 200; // characters of a long learning-stage answer shown before "expand"

  async function apiGetJson(path) {
    const res = await fetch(path, { headers: { "X-Grading-Token": token } });
    if (res.status === 401) {
      throw new SessionExpiredError();
    }
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}: ${res.statusText}`);
    }
    return res.json();
  }

  function answerHtml(item) {
    const a = item.answer || {};
    if (item.stage === "learning") {
      const text = a.text || "";
      if (text.length <= REVIEW_EXCERPT) {
        return `<p>${escapeHtml(text)}</p>`;
      }
      return `<details><summary>${escapeHtml(text.slice(0, REVIEW_EXCERPT))}…</summary><p>${escapeHtml(text)}</p></details>`;
    }
    return `<p>Kategoria <strong class="lr">${escapeHtml(a.category)}</strong> · modyfikator S: ${a.modifier_s ? "Tak" : "Nie"}</p>`;
  }

  function itemHeading(item) {
    const stage = STAGE_LABELS[item.stage] || item.stage;
    return `<h3>${escapeHtml(stage)} · przypadek ${escapeHtml(item.position)} / ${escapeHtml(item.total_in_stage)}</h3><p>${escapeHtml(item.title)}</p>`;
  }

  async function showReview() {
    try {
      const data = await apiGetJson("/api/review");
      if (!data.complete) {
        await loadCase();
        return;
      }
      if (data.finalized) {
        await showReveal();
        return;
      }
      let html = `<h2>Podsumowanie odpowiedzi</h2>
        <p>Sprawdź swoje odpowiedzi. Po zatwierdzeniu zobaczysz poprawne odpowiedzi, a odpowiedzi nie będzie można zmienić.</p>`;
      for (const item of data.items) {
        html += `<div class="answer-box">${itemHeading(item)}${answerHtml(item)}</div>`;
      }
      html += `<button id="approve-btn">Zatwierdź i zakończ</button><p id="approve-error" class="error"></p>`;
      panel.innerHTML = html;
      document.getElementById("approve-btn").addEventListener("click", approveReview);
    } catch (err) {
      if (err instanceof SessionExpiredError) {
        showSessionExpired();
        return;
      }
      showError("Błąd ładowania podsumowania", err, "retry-btn", "Spróbuj ponownie");
      document.getElementById("retry-btn").addEventListener("click", showReview);
    }
  }

  async function approveReview() {
    const button = document.getElementById("approve-btn");
    const errorBox = document.getElementById("approve-error");
    button.disabled = true; // one click, one request: a double click must not send two
    try {
      const res = await fetch("/api/finalize", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token }),
      });
      if (res.status === 401) {
        throw new SessionExpiredError();
      }
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}: ${res.statusText}`);
      }
      await showReveal();
    } catch (err) {
      if (err instanceof SessionExpiredError) {
        showSessionExpired();
        return;
      }
      // the review stays on screen and can be approved again (the server call is idempotent)
      errorBox.textContent = `Nie udało się zatwierdzić: ${err.message}`;
      button.disabled = false;
    }
  }

  async function showReveal() {
    try {
      const data = await apiGetJson("/api/results");
      if (!data.complete) {
        await loadCase();
        return;
      }
      if (!data.finalized) {
        await showReview();
        return;
      }
      const pct = data.accuracy !== null ? `${Math.round(data.accuracy * 100)}%` : "brak danych";
      let html = `<h2 id="results-title">Wyniki końcowe</h2>
        <p>Wynik testu: ${escapeHtml(data.test_correct)} / ${escapeHtml(data.test_total)} (${escapeHtml(pct)})</p>`;
      for (const item of data.items) {
        html += `<div class="answer-box">${itemHeading(item)}<h4>Twoja odpowiedź</h4>${answerHtml(item)}`;
        if (item.correct !== null) {
          const cls = item.correct ? "feedback-correct" : "feedback-incorrect";
          html += `<h4 class="${cls}">${item.correct ? "Poprawnie" : "Niepoprawnie"}</h4>`;
        }
        html += `<p>Kategoria referencyjna: <strong class="lr">${escapeHtml(item.ground_truth_category)}${item.ground_truth_modifier_s ? " (S)" : ""}</strong></p>
          <div class="answer-box reference"><p>${boldLungRads(escapeHtml(item.reference_report))}</p></div></div>`;
      }
      // issue #98: starting over deletes the recorded answers, so the server only offers it when
      // GRADING_RESET_ENABLED=1 (local testing); otherwise a new doctor gets a new session.
      if (data.reset_enabled) {
        html += `<button id="restart-btn">Rozpocznij od początku</button>`;
      }
      panel.innerHTML = html;
      const restartButton = document.getElementById("restart-btn");
      if (restartButton) restartButton.addEventListener("click", async () => {
        try {
          const resetRes = await fetch("/api/reset", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token }),
          });
          if (resetRes.status === 401) {
            showSessionExpired();
            return;
          }
          loadCase();
        } catch (err) {
          showError("Błąd resetu", err);
        }
      });
    } catch (err) {
      if (err instanceof SessionExpiredError) {
        showSessionExpired();
        return;
      }
      showError("Błąd ładowania wyników", err, "retry-btn", "Spróbuj ponownie");
      document.getElementById("retry-btn").addEventListener("click", showReveal);
    }
  }

  loadCase();
})();
</script>
</body>
</html>
