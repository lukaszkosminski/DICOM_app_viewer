name: CI

# Staged pipeline: each stage gates the next (needs:), so a cheap failure
# (bad syntax, a build break) fails in seconds instead of waiting on the
# slowest stage. Jobs grouped under the same conceptual stage (e.g. Unit &
# Shell Tests) still run in parallel with each other -- only the stage
# boundary itself is sequential.
#
#   PR Created --> 1. Lint & Format (fastest)
#              --> 2. Build Test (does it compile?)
#              --> 3. Security Scan (SAST)
#              --> 4. Unit & Shell Tests
#              --> 5. Integration Tests (slowest)
#              --> Success: ready for code review and merge
#
# Every script here (scripts/lint.sh, build-test.sh, security-scan.sh,
# test-grading-api.sh, test-shell-scripts.sh, smoke-test.sh,
# test-guacamole-integration.sh, test-visual-regression.sh,
# test-copy-lockdown.sh, test-log-leak.sh, test-overlay-shape.sh,
# test-overlay-compositor.sh, test-degraded-modes.sh) is runnable
# identically on a
# local machine -- this
# file only handles installing each stage's prerequisites, never
# duplicates the check logic itself.

# issue #67: least-privilege token. Every job here only reads the repository (checkout) and
# uploads an artifact (which uses the runner's own token, not GITHUB_TOKEN permissions); a job
# that ever needs more must say so in its own `permissions:` block instead of widening this.
permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  # ---- 1. Lint & Format ----
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"  # matches docker/grading-api/Dockerfile's own base image
      - name: Install ruff
        run: pip install -r docker/grading-api/requirements-dev.txt
      - name: Lint & Format (bash syntax, compose config, ruff check/format)
        run: ./scripts/lint.sh

  # ---- 2. Build Test ----
  build-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build every image in the repo (does it compile?)
        run: ./scripts/build-test.sh

  # ---- 3. Security Scan (SAST) ----
  security-scan:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install -r docker/grading-api/requirements-dev.txt
      # shellcheck ships preinstalled on GitHub's ubuntu-latest runner image.
      # issue #67: downloads fail loudly (-f), retry transient errors, and are verified against
      # a pinned SHA-256 before they are used. The sums are the ones the vendors publish next to
      # the release (hadolint-Linux-x86_64.sha256, trivy_0.74.0_checksums.txt) and were
      # re-computed on a fresh download; that is integrity against the vendor's record, not a
      # signature. Bumping a tool version REQUIRES bumping its sum (a stale one fails the job).
      - name: Install hadolint
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64"
          echo "56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010  hadolint" | sha256sum -c -
          sudo install -m 0755 hadolint /usr/local/bin/hadolint
      - name: Install trivy
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz"
          echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  trivy.tar.gz" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f trivy.tar.gz trivy
      - name: Security Scan (bandit, shellcheck, hadolint, trivy)
        run: ./scripts/security-scan.sh

  # ---- 4. Unit & Shell Tests ----
  unit-test:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Unit test grading-api's state machine (issue #8)
        run: ./scripts/test-grading-api.sh
      - name: Upload coverage report (issue #101)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grading-api-coverage
          path: docker/grading-api/coverage.xml

  shell-test:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install bats
        run: sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y -qq bats
      - name: BATS test the Kasm workspace launcher scripts (issue #16)
        run: ./scripts/test-shell-scripts.sh

  provision-guacamole-session-test:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Unit test provision-guacamole-session.py (issue #53)
        run: ./scripts/test-provision-guacamole-session.sh

  # ---- 5. Integration Tests ----
  smoke-test:
    runs-on: ubuntu-latest
    needs: [unit-test, shell-test, provision-guacamole-session-test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Smoke test (brings the stack up, checks the endpoints)
        run: ./scripts/smoke-test.sh

  degraded-test:
    runs-on: ubuntu-latest
    needs: [unit-test, shell-test, provision-guacamole-session-test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Degraded-mode E2E (issue #115: every documented failure row of docs/DEGRADED_MODES.md holds)
        run: ./scripts/test-degraded-modes.sh

  guacamole-integration-test:
    runs-on: ubuntu-latest
    needs: [unit-test, shell-test, provision-guacamole-session-test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Guacamole PoC end-to-end test (Playwright, docker-in-docker)
        run: ./scripts/test-guacamole-integration.sh

  visual-regression-test:
    runs-on: ubuntu-latest
    needs: [unit-test, shell-test, provision-guacamole-session-test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Visual regression test (watermark.html + grading-panel.html)
        run: ./scripts/test-visual-regression.sh
      # On a mismatch, the plugin overwrites the baseline in this ephemeral
      # checkout (so it can be diffed here) but never touches the committed
      # one -- upload the actual/expected/diff images so a reviewer can see
      # exactly what changed, since docker/viewer/tests/__snapshot_failures__/
      # is gitignored and wouldn't otherwise survive past this job.
      - name: Upload visual diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-regression-diffs
          path: docker/viewer/tests/__snapshot_failures__/
          if-no-files-found: ignore

  copy-lockdown-test:
    runs-on: ubuntu-latest
    needs: [unit-test, shell-test, provision-guacamole-session-test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Copy-mechanism lockdown test (Weasis export/import/send/Q-R, KasmVNC rich-clipboard DLP)
        run: ./scripts/test-copy-lockdown.sh

  log-leak-test:
    runs-on: ubuntu-latest
    needs: [unit-test, shell-test, provision-guacamole-session-test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Sentinel log-leak test (no credential/PHI value in any nginx log path, issue #94/#93)
        run: ./scripts/test-log-leak.sh

  overlay-shape-test:
    runs-on: ubuntu-latest
    needs: [unit-test, shell-test, provision-guacamole-session-test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Watermark overlay shape-complexity budget (flicker regression guard)
        run: ./scripts/test-overlay-shape.sh

  overlay-compositor-test:
    runs-on: ubuntu-latest
    needs: [unit-test, shell-test, provision-guacamole-session-test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Watermark overlay modes on a real X server (picom alpha / shape fallback, issue #150)
        run: ./scripts/test-overlay-compositor.sh

  # ---- Success ----
  # issue #124: this job is the single status a reviewer looks at, so it must
  # depend on EVERY job and accept ONLY "success". The previous version listed
  # just the stage-5 jobs and checked for 'failure'/'cancelled': when an earlier
  # stage failed, its dependents became "skipped" -- neither word -- and the gate
  # stayed green over a red pipeline (PR #121). "skipped" is therefore NOT an
  # accepted state here: every job is unconditional in this workflow, so a skip
  # can only mean an ancestor failed or was cancelled. The logic lives in
  # scripts/ci-gate.py (unit-tested by scripts/ci-gate.bats, runnable locally).
  # Since issue #135 the gate ALSO compares this `needs` list against the job ids
  # declared in this file and exits 2 on drift (missing or stale entries), so a
  # forgotten job here fails ci-success instead of silently green-lighting it.
  # When adding a job to this workflow, add it to `needs` below.
  ci-success:
    runs-on: ubuntu-latest
    needs:
      - lint
      - build-test
      - security-scan
      - unit-test
      - shell-test
      - provision-guacamole-session-test
      - smoke-test
      - degraded-test
      - guacamole-integration-test
      - visual-regression-test
      - copy-lockdown-test
      - log-leak-test
      - overlay-shape-test
      - overlay-compositor-test
    if: always()
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Confirm every job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci-gate.py
